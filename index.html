<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Остановки Бреста</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<style>
  :root {
    --font: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Inter", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --text: #1d1d1f;
    --text-2: rgba(60, 60, 67, 0.72);
    --text-3: rgba(60, 60, 67, 0.48);
    --glass-bg: rgba(255, 255, 255, 0.52);
    --glass-bg-strong: rgba(255, 255, 255, 0.72);
    --glass-tint: linear-gradient(160deg, rgba(255,255,255,0.55) 0%, rgba(255,255,255,0.18) 45%, rgba(255,255,255,0.32) 100%);
    --glass-border: linear-gradient(135deg, rgba(255,255,255,0.95) 0%, rgba(255,255,255,0.25) 35%, rgba(255,255,255,0.05) 60%, rgba(255,255,255,0.7) 100%);
    --fill: rgba(118, 118, 128, 0.12);
    --fill-2: rgba(118, 118, 128, 0.2);
    --separator: rgba(60, 60, 67, 0.14);
    --shadow: 0 24px 64px rgba(0, 0, 0, 0.16), 0 4px 14px rgba(0, 0, 0, 0.08), inset 0 1px 0 rgba(255,255,255,0.6);
    --accent: #0a84ff;
    --accent-soft: rgba(10, 132, 255, 0.14);
    --good: #34c759;
    --satisfactory: #ff9f0a;
    --bad: #ff3b30;
    --ease: cubic-bezier(0.32, 0.72, 0, 1);
    --spring: cubic-bezier(0.34, 1.56, 0.64, 1);
    --radius-xl: 28px;
    --radius-l: 20px;
    --radius-m: 14px;
    --radius-s: 10px;
  }
  body.dark {
    --text: #f5f5f7;
    --text-2: rgba(235, 235, 245, 0.7);
    --text-3: rgba(235, 235, 245, 0.42);
    --glass-bg: rgba(30, 30, 34, 0.48);
    --glass-bg-strong: rgba(36, 36, 40, 0.72);
    --glass-tint: linear-gradient(160deg, rgba(255,255,255,0.14) 0%, rgba(255,255,255,0.03) 45%, rgba(255,255,255,0.08) 100%);
    --glass-border: linear-gradient(135deg, rgba(255,255,255,0.45) 0%, rgba(255,255,255,0.08) 35%, rgba(255,255,255,0.02) 60%, rgba(255,255,255,0.28) 100%);
    --fill: rgba(118, 118, 128, 0.24);
    --fill-2: rgba(118, 118, 128, 0.34);
    --separator: rgba(84, 84, 88, 0.5);
    --shadow: 0 24px 64px rgba(0, 0, 0, 0.5), 0 4px 14px rgba(0, 0, 0, 0.3), inset 0 1px 0 rgba(255,255,255,0.12);
    --accent-soft: rgba(10, 132, 255, 0.24);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; }
  body {
    font-family: var(--font);
    color: var(--text);
    background: #e9ecef;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    font-feature-settings: "kern", "liga", "tnum";
    letter-spacing: -0.01em;
    transition: color .4s var(--ease);
  }
  body.dark { background: #111; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  input { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 8px; }

  /* ---------- MAP ---------- */
  #map { position: fixed; inset: 0; z-index: 0; }
  .maplibregl-ctrl-attrib { font-size: 10px; }
  .maplibregl-ctrl-bottom-right { z-index: 1; }

  /* ---------- LIQUID GLASS ---------- */
  .glass {
    position: relative;
    background: var(--glass-bg);
    background-image: var(--glass-tint);
    -webkit-backdrop-filter: blur(40px) saturate(200%);
    backdrop-filter: blur(40px) saturate(200%);
    box-shadow: var(--shadow);
    border-radius: var(--radius-xl);
    isolation: isolate;
  }
  .glass::before {
    content: "";
    position: absolute;
    inset: 0;
    padding: 1px;
    border-radius: inherit;
    background: var(--glass-border);
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite: xor;
    mask-composite: exclude;
    pointer-events: none;
    z-index: 2;
  }
  .glass::after {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: inherit;
    background: radial-gradient(120% 60% at 20% 0%, rgba(255,255,255,0.35), transparent 60%);
    opacity: .55;
    pointer-events: none;
    z-index: -1;
  }
  body.dark .glass::after { opacity: .18; }

  /* ---------- HEADER ---------- */
  .header {
    position: fixed;
    top: max(14px, env(safe-area-inset-top));
    left: 14px; right: 14px;
    z-index: 20;
    height: 60px;
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 0 10px 0 14px;
    border-radius: 22px;
    animation: dropIn .8s var(--ease) both;
  }
  .logo { display: flex; align-items: center; gap: 10px; flex-shrink: 0; user-select: none; }
  .logo-icon {
    width: 36px; height: 36px; border-radius: 11px;
    display: grid; place-items: center;
    background: linear-gradient(145deg, #3aa0ff, #0a5cff);
    box-shadow: 0 6px 16px rgba(10, 100, 255, 0.35), inset 0 1px 0 rgba(255,255,255,0.45);
    color: #fff;
  }
  .logo-text { display: flex; flex-direction: column; line-height: 1.1; }
  .logo-text b { font-size: 15px; font-weight: 650; letter-spacing: -0.02em; }
  .logo-text span { font-size: 11.5px; color: var(--text-2); }

  .search-wrap { position: relative; flex: 1; max-width: 520px; margin: 0 auto; }
  .search-field {
    display: flex; align-items: center; gap: 8px;
    height: 38px; padding: 0 12px;
    border-radius: 12px;
    background: var(--fill);
    transition: background .25s var(--ease), box-shadow .25s var(--ease);
  }
  .search-field:focus-within { background: var(--glass-bg-strong); box-shadow: 0 0 0 3px var(--accent-soft); }
  .search-field svg { flex-shrink: 0; color: var(--text-3); }
  #search { flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; font-size: 14.5px; }
  #search::placeholder { color: var(--text-3); }
  .kbd {
    font-size: 11px; color: var(--text-3); padding: 2px 6px; border-radius: 6px;
    border: 1px solid var(--separator); flex-shrink: 0;
  }
  .search-results {
    position: absolute; top: calc(100% + 10px); left: 0; right: 0;
    list-style: none; padding: 6px;
    border-radius: 18px;
    opacity: 0; transform: translateY(-6px) scale(.98); pointer-events: none;
    transition: opacity .22s var(--ease), transform .3s var(--ease);
    transform-origin: top center;
    max-height: 60vh; overflow: auto;
  }
  .search-results.open { opacity: 1; transform: none; pointer-events: auto; }
  .search-results li {
    display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 12px; cursor: pointer;
    transition: background .15s;
  }
  .search-results li[aria-selected="true"], .search-results li:hover { background: var(--fill); }
  .search-results .r-name { font-weight: 590; font-size: 14px; }
  .search-results .r-sub { font-size: 12px; color: var(--text-2); }
  .search-results .empty { color: var(--text-2); font-size: 13px; justify-content: center; cursor: default; }
  .search-results .empty:hover { background: none; }
  mark { background: var(--accent-soft); color: inherit; border-radius: 4px; padding: 0 1px; }

  .actions { display: flex; gap: 6px; flex-shrink: 0; position: relative; }
  .icon-btn {
    width: 40px; height: 40px; border-radius: 12px;
    display: grid; place-items: center;
    color: var(--text);
    transition: background .2s var(--ease), transform .35s var(--spring), color .2s;
  }
  .icon-btn:hover { background: var(--fill); }
  .icon-btn:active { transform: scale(.9); }
  .icon-btn[aria-expanded="true"] { background: var(--accent-soft); color: var(--accent); }
  .icon-btn.loading svg { animation: spin 1s linear infinite; }
  .icon-btn.located { color: var(--accent); }

  .popover {
    position: absolute; top: calc(100% + 16px); right: 0;
    width: 260px; padding: 8px;
    border-radius: 20px;
    opacity: 0; transform: translateY(-8px) scale(.96); pointer-events: none;
    transform-origin: top right;
    transition: opacity .22s var(--ease), transform .35s var(--ease);
  }
  .popover.open { opacity: 1; transform: none; pointer-events: auto; }
  .popover h4 { font-size: 11.5px; font-weight: 600; color: var(--text-2); text-transform: uppercase; letter-spacing: .04em; padding: 8px 10px 6px; }
  .pop-item {
    width: 100%; display: flex; align-items: center; gap: 12px;
    padding: 9px 10px; border-radius: 12px; text-align: left; font-size: 14px;
    transition: background .15s;
  }
  .pop-item:hover { background: var(--fill); }
  .swatch { width: 30px; height: 22px; border-radius: 7px; flex-shrink: 0; box-shadow: inset 0 0 0 1px rgba(0,0,0,.08); }
  .pop-item .check { margin-left: auto; color: var(--accent); opacity: 0; transition: opacity .2s; }
  .pop-item[aria-checked="true"] .check { opacity: 1; }

  .switch { margin-left: auto; width: 38px; height: 23px; border-radius: 99px; background: var(--fill-2); position: relative; transition: background .25s var(--ease); flex-shrink: 0; }
  .switch::after {
    content: ""; position: absolute; top: 2px; left: 2px; width: 19px; height: 19px; border-radius: 50%;
    background: #fff; box-shadow: 0 2px 6px rgba(0,0,0,.2); transition: transform .35s var(--spring);
  }
  .pop-item[aria-checked="true"] .switch { background: var(--good); }
  .pop-item[aria-checked="true"] .switch::after { transform: translateX(15px); }

  /* ---------- MARKERS ---------- */
  /* Корневой элемент маркера не трансформируется нами: MapLibre сам задаёт ему transform. */
  .marker {
    width: 30px; height: 30px;
    cursor: pointer;
    --c: var(--good);
  }
  .marker-dot {
    position: absolute; inset: 3px;
    border-radius: 50%;
    display: grid; place-items: center;
    background: var(--c);
    color: #fff;
    box-shadow: 0 0 0 3px #fff, 0 4px 12px rgba(0,0,0,.3);
    transition: transform .35s var(--spring), box-shadow .3s var(--ease);
    will-change: transform;
  }
  body.dark .marker-dot { box-shadow: 0 0 0 3px rgba(30,30,34,.95), 0 4px 12px rgba(0,0,0,.5); }
  .marker:hover .marker-dot, .marker:focus-visible .marker-dot { transform: scale(1.18); }
  .marker.active .marker-dot { transform: scale(1.28); box-shadow: 0 0 0 3px #fff, 0 0 0 7px color-mix(in srgb, var(--c) 35%, transparent), 0 6px 18px rgba(0,0,0,.35); }
  .marker-pulse {
    position: absolute; inset: 3px; border-radius: 50%;
    background: var(--c); opacity: 0; pointer-events: none;
  }
  .marker.active .marker-pulse { animation: pulse 2s var(--ease) infinite; }
  .marker-label {
    position: absolute; top: calc(100% + 4px); left: 50%;
    transform: translateX(-50%);
    white-space: nowrap;
    font-size: 11.5px; font-weight: 600;
    padding: 3px 8px; border-radius: 8px;
    background: var(--glass-bg-strong);
    -webkit-backdrop-filter: blur(20px) saturate(180%);
    backdrop-filter: blur(20px) saturate(180%);
    box-shadow: 0 2px 8px rgba(0,0,0,.12);
    pointer-events: none;
    transition: opacity .25s var(--ease);
  }
  body.hide-labels .marker-label { opacity: 0; }
  .marker.small { width: 22px; height: 22px; }
  .marker.small .marker-dot { inset: 3px; box-shadow: 0 0 0 2px #fff, 0 2px 8px rgba(0,0,0,.3); }

  .user-marker { width: 22px; height: 22px; }
  .user-marker .u-dot {
    position: absolute; inset: 4px; border-radius: 50%;
    background: var(--accent); box-shadow: 0 0 0 3px #fff, 0 2px 8px rgba(0,0,0,.3);
  }
  .user-marker .u-halo {
    position: absolute; inset: -14px; border-radius: 50%;
    background: rgba(10,132,255,.22); animation: halo 2.4s ease-out infinite;
  }

  /* ---------- MINI CARD ---------- */
  #mini-card {
    position: fixed; left: 20px; bottom: 28px; z-index: 15;
    width: 370px; max-width: calc(100vw - 40px);
    padding: 18px;
    opacity: 0; transform: translateY(24px) scale(.96); pointer-events: none;
    transform-origin: bottom left;
    transition: opacity .3s var(--ease), transform .55s var(--ease);
  }
  #mini-card.show { opacity: 1; transform: none; pointer-events: auto; }
  #mini-card.bump { animation: bump .45s var(--ease); }
  .mini-head { display: flex; align-items: flex-start; gap: 12px; }
  .mini-icon {
    width: 42px; height: 42px; border-radius: 13px; flex-shrink: 0;
    display: grid; place-items: center; color: #fff;
    background: var(--c, var(--good));
    box-shadow: 0 6px 16px color-mix(in srgb, var(--c, var(--good)) 40%, transparent), inset 0 1px 0 rgba(255,255,255,.4);
  }
  .mini-titles { flex: 1; min-width: 0; }
  #mini-title { font-size: 19px; font-weight: 680; letter-spacing: -0.025em; line-height: 1.2; }
  #mini-addr { font-size: 13px; color: var(--text-2); margin-top: 2px; }
  .close-btn {
    width: 28px; height: 28px; border-radius: 50%; flex-shrink: 0;
    display: grid; place-items: center; background: var(--fill); color: var(--text-2);
    transition: background .2s, transform .3s var(--spring);
  }
  .close-btn:hover { background: var(--fill-2); color: var(--text); }
  .close-btn:active { transform: scale(.88); }

  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  #mini-buses { margin-top: 14px; }
  .chip {
    display: inline-flex; align-items: center; justify-content: center;
    min-width: 34px; height: 26px; padding: 0 9px;
    border-radius: 8px; font-size: 13px; font-weight: 650;
    background: var(--accent-soft); color: var(--accent);
    transition: transform .3s var(--spring), background .2s, color .2s;
  }
  button.chip:hover { transform: translateY(-1px); }
  .chip.muted { background: var(--fill); color: var(--text-2); }
  .chip.active { background: var(--accent); color: #fff; }

  #mini-info {
    margin-top: 14px;
    display: grid; grid-template-columns: 1fr 1fr; gap: 1px;
    border-radius: 14px; overflow: hidden;
    background: var(--separator);
  }
  .info-row {
    display: flex; justify-content: space-between; align-items: center; gap: 8px;
    padding: 8px 11px; font-size: 12.5px;
    background: var(--glass-bg-strong);
  }
  .info-row span:first-child { color: var(--text-2); }
  .info-row span:last-child { font-weight: 590; text-align: right; }
  .info-row.full { grid-column: 1 / -1; }
  .state-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; vertical-align: 1px; }
  .yes { color: var(--good); }
  .no { color: var(--text-3); }

  #mini-btn {
    margin-top: 14px; width: 100%; height: 44px; border-radius: 14px;
    display: flex; align-items: center; justify-content: center; gap: 8px;
    font-size: 15px; font-weight: 600; color: #fff;
    background: linear-gradient(180deg, #2b95ff, #0a7aff);
    box-shadow: 0 8px 20px rgba(10,132,255,.35), inset 0 1px 0 rgba(255,255,255,.35);
    transition: transform .35s var(--spring), box-shadow .25s, filter .2s;
  }
  #mini-btn:hover { filter: brightness(1.06); box-shadow: 0 10px 26px rgba(10,132,255,.45), inset 0 1px 0 rgba(255,255,255,.35); }
  #mini-btn:active { transform: scale(.97); }

  /* ---------- LEGEND ---------- */
  .legend {
    position: fixed; right: 16px; bottom: 40px; z-index: 10;
    padding: 12px 10px 10px; width: 230px;
    border-radius: 20px;
    animation: riseIn .8s .15s var(--ease) both;
  }
  .legend h4 { font-size: 11.5px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; color: var(--text-2); padding: 0 6px 6px; }
  .legend-item {
    width: 100%; display: flex; align-items: center; gap: 10px;
    padding: 7px 6px; border-radius: 10px; font-size: 13px; text-align: left;
    transition: background .15s, opacity .25s;
  }
  .legend-item:hover { background: var(--fill); }
  .legend-item[aria-pressed="false"] { opacity: .4; }
  .legend-item .ldot { width: 14px; height: 14px; border-radius: 50%; box-shadow: 0 0 0 2px #fff, 0 1px 4px rgba(0,0,0,.25); flex-shrink: 0; }
  .legend-item .count { margin-left: auto; font-size: 12px; color: var(--text-3); font-variant-numeric: tabular-nums; }
  .legend .route-key { display: flex; align-items: center; gap: 10px; padding: 7px 6px 2px; font-size: 13px; border-top: 1px solid var(--separator); margin-top: 4px; }
  .legend .route-key i { width: 14px; height: 0; border-top: 3px dashed var(--accent); }

  /* ---------- STOP PAGE ---------- */
  #stop-page {
    position: fixed; inset: 0; z-index: 30;
    display: grid; place-items: center;
    padding: 24px;
    background: rgba(0,0,0,0);
    pointer-events: none;
    transition: background .4s var(--ease);
  }
  #stop-page.open { background: rgba(0,0,0,.22); pointer-events: auto; }
  body.dark #stop-page.open { background: rgba(0,0,0,.45); }
  .sp-panel {
    width: min(1040px, 100%); max-height: min(860px, calc(100vh - 48px));
    display: flex; flex-direction: column;
    border-radius: 32px;
    opacity: 0; transform: translateY(30px) scale(.95);
    transition: opacity .3s var(--ease), transform .55s var(--ease);
    overflow: hidden;
  }
  #stop-page.open .sp-panel { opacity: 1; transform: none; }
  .sp-toolbar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 16px 0 22px; flex-shrink: 0;
  }
  .traffic { display: flex; gap: 8px; }
  .traffic button { width: 13px; height: 13px; border-radius: 50%; box-shadow: inset 0 0 0 .5px rgba(0,0,0,.2); position: relative; }
  .traffic .t-close { background: #ff5f57; }
  .traffic .t-min { background: #febc2e; }
  .traffic .t-max { background: #28c840; }
  .traffic button::after { content: ""; position: absolute; inset: 0; border-radius: 50%; opacity: 0; transition: opacity .15s; }
  .traffic:hover .t-close::after { opacity: 1; background: radial-gradient(circle, rgba(0,0,0,.45) 0 1.2px, transparent 1.6px); }
  .sp-crumbs { font-size: 12.5px; color: var(--text-2); }
  #stop-page-content { overflow: auto; padding: 18px 26px 26px; overscroll-behavior: contain; }
  #stop-page-content.fade { animation: contentIn .45s var(--ease); }

  .sp-head { display: flex; align-items: center; gap: 16px; }
  .sp-icon {
    width: 58px; height: 58px; border-radius: 18px; flex-shrink: 0;
    display: grid; place-items: center; color: #fff;
    background: var(--c);
    box-shadow: 0 10px 24px color-mix(in srgb, var(--c) 40%, transparent), inset 0 1px 0 rgba(255,255,255,.45);
  }
  .sp-head h2 { font-size: 30px; font-weight: 720; letter-spacing: -0.035em; line-height: 1.1; }
  .sp-head p { font-size: 14px; color: var(--text-2); margin-top: 3px; }
  .badge {
    margin-left: auto; flex-shrink: 0;
    display: inline-flex; align-items: center; gap: 6px;
    padding: 6px 12px; border-radius: 99px; font-size: 13px; font-weight: 600;
    color: var(--c); background: color-mix(in srgb, var(--c) 15%, transparent);
  }
  .badge::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--c); }
  .sp-desc { margin-top: 16px; font-size: 15px; line-height: 1.5; color: var(--text); }

  .sp-body { margin-top: 22px; display: grid; grid-template-columns: 1.35fr 1fr; gap: 18px; align-items: start; }
  .sp-col { display: flex; flex-direction: column; gap: 18px; min-width: 0; }
  .card {
    background: var(--glass-bg-strong);
    border-radius: var(--radius-l);
    padding: 16px;
    box-shadow: 0 1px 0 rgba(255,255,255,.5) inset, 0 1px 3px rgba(0,0,0,.05);
  }
  body.dark .card { box-shadow: 0 1px 0 rgba(255,255,255,.06) inset; }
  .card h3 { font-size: 15px; font-weight: 650; letter-spacing: -0.015em; margin-bottom: 12px; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .card h3 small { font-size: 12.5px; font-weight: 500; color: var(--text-2); }

  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
  .stat { padding: 12px; border-radius: 14px; background: var(--fill); }
  .stat b { display: block; font-size: 24px; font-weight: 700; letter-spacing: -0.03em; font-variant-numeric: tabular-nums; }
  .stat span { font-size: 12px; color: var(--text-2); }
  .facilities { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-top: 10px; }
  .facility { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 12px; background: var(--fill); font-size: 13.5px; }
  .facility .f-ic { width: 28px; height: 28px; border-radius: 8px; display: grid; place-items: center; background: var(--glass-bg-strong); flex-shrink: 0; font-size: 15px; }
  .facility .f-val { margin-left: auto; font-weight: 600; }

  .tabs { display: inline-flex; padding: 3px; border-radius: 11px; background: var(--fill); gap: 2px; flex-wrap: wrap; }
  .tab { padding: 6px 14px; border-radius: 8px; font-size: 13px; font-weight: 600; color: var(--text-2); transition: background .25s var(--ease), color .2s, box-shadow .25s; }
  .tab[aria-selected="true"] { background: var(--glass-bg-strong); color: var(--text); box-shadow: 0 2px 8px rgba(0,0,0,.1); }
  body.dark .tab[aria-selected="true"] { background: rgba(255,255,255,.14); }

  .next-card {
    margin: 12px 0; padding: 12px 14px; border-radius: 14px;

  #toast {
    position: fixed; top: 90px; left: 50%; z-index: 40;

    transform: translate(-50%, -10px); opacity: 0; pointer-events: none;
    transition: opacity .25s var(--ease), transform .4s var(--ease);

    bounds,
    fitBoundsOptions: { padding: { top: 120, bottom: 120, left: 80, right: 80 } },
    attributionControl: false,
    maxPitch: 60
  });
  map.addControl(new maplibregl.AttributionControl({ compact: true }), 'bottom-right');

  function addRouteLayer() {
    if (map.getSource('route')) return;
    const isDark = currentStyle.dark;
    map.addSource('route', {
      type: 'geojson',
      data: { type: 'Feature', properties: {}, geometry: { type: 'LineString', coordinates: STOPS.map(s => s.coords) } }
    });
    const visibility = layerState.route ? 'visible' : 'none';
    map.addLayer({
      id: 'route-casing', type: 'line', source: 'route',
      layout: { 'line-join': 'round', 'line-cap': 'round', visibility },
      paint: { 'line-color': isDark ? '#000' : '#fff', 'line-width': 8, 'line-opacity': isDark ? 0.45 : 0.85 }
    });
    map.addLayer({
      id: 'route-line', type: 'line', source: 'route',
      layout: { 'line-join': 'round', 'line-cap': 'round', visibility },
      paint: { 'line-color': '#0a84ff', 'line-width': 4, 'line-dasharray': [1.6, 1.4] }
    });
  }
  map.on('style.load', addRouteLayer);
  map.on('error', e => console.warn('Map error:', e && e.error ? e.error.message : e));

  // ================= MARKERS =================
  const markers = {};
  STOPS.forEach(stop => {
    const el = document.createElement('div');
    el.className = 'marker';
    el.dataset.id = stop.id;
    el.dataset.state = stop.state;
    el.tabIndex = 0;
    el.setAttribute('role', 'button');
    el.setAttribute('aria-label', `Остановка ${stop.name}, состояние: ${STATE[stop.state].label}`);
    el.style.setProperty('--c', STATE[stop.state].color);
    el.innerHTML = `<span class="marker-pulse"></span><span class="marker-dot">${ICON_BUS}</span><span class="marker-label">${esc(stop.name)}</span>`;
    el.addEventListener('click', e => { e.stopPropagation(); selectStop(stop.id); });
    el.addEventListener('keydown', e => {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); selectStop(stop.id); }
    });
    markers[stop.id] = new maplibregl.Marker({ element: el, anchor: 'center' })
      .setLngLat(stop.coords)
      .addTo(map);
  });

  map.on('click', e => {
    const t = e.originalEvent && e.originalEvent.target;
    if (t && t.closest && t.closest('.marker')) return;
    hideMini();
  });

  // ================= MINI CARD =================
  const miniCard = $('#mini-card');

  function selectStop(id, { fly = true } = {}) {
    const stop = byId[id];
    if (!stop) return;
    const wasShown = miniCard.classList.contains('show');
    currentId = id;

    Object.entries(markers).forEach(([mid, m]) => {
      const el = m.getElement();
      const active = mid === id;
      el.classList.toggle('active', active);
      el.style.zIndex = active ? '5' : '';
    });

    fillMini(stop);
    miniCard.classList.add('show');
    miniCard.setAttribute('aria-hidden', 'false');
    if (wasShown) {
      miniCard.classList.remove('bump');
      void miniCard.offsetWidth;
      miniCard.classList.add('bump');
    }

    if (fly) {
      const wide = window.innerWidth > 720;
      map.flyTo({
        center: stop.coords,
        zoom: Math.max(map.getZoom(), 15.6),
        offset: wide ? [190, 0] : [0, -140],
        duration: 900,
        essential: true
      });
    }
  }

  function fillMini(stop) {
    const st = STATE[stop.state];
    $('#mini-icon').style.setProperty('--c', st.color);
    $('#mini-title').textContent = stop.name;
    $('#mini-addr').textContent = `${stop.address} · ${stop.built} г.`;
    $('#mini-buses').innerHTML = stop.buses
      .map(b => `<span class="chip${stop.schedule[b] ? '' : ' muted'}">${esc(b)}</span>`).join('');
    $('#mini-info').innerHTML = `
      <div class="info-row full"><span>Состояние</span><span><i class="state-dot" style="background:${st.color}"></i>${st.label}</span></div>
      <div class="info-row"><span>Покрытие</span><span>${SURFACE[stop.surface] || esc(stop.surface)}</span></div>
      <div class="info-row"><span>Сквер</span><span>${yesNo(stop.has_square)}</span></div>
      <div class="info-row"><span>Магазин</span><span>${yesNo(stop.has_shop)}</span></div>
      <div class="info-row"><span>Тренажёры</span><span>${yesNo(stop.trainers)}</span></div>
      <div class="info-row"><span>Урны</span><span>${stop.bins}</span></div>
      <div class="info-row"><span>Лавочки</span><span>${stop.benches}</span></div>
      <div class="info-row full"><span>Деревья</span><span>${stop.trees}</span></div>`;
  }

  function hideMini() {
    miniCard.classList.remove('show');
    miniCard.setAttribute('aria-hidden', 'true');
    Object.values(markers).forEach(m => { m.getElement().classList.remove('active'); m.getElement().style.zIndex = ''; });
    currentId = null;
  }

  $('#mini-close').addEventListener('click', hideMini);
  $('#mini-btn').addEventListener('click', () => { if (currentId) openStopPage(currentId); });

  // ================= STOP PAGE =================
  const stopPage = $('#stop-page');
  const pageContent = $('#stop-page-content');

  function openStopPage(id) {
    const stop = byId[id];
    if (!stop) return;
    pageStopId = id;
    pageRoute = Object.keys(stop.schedule)[0] || null;
    renderPage(stop);
    stopPage.classList.add('open');
    stopPage.setAttribute('aria-hidden', 'false');
    closePopovers();
    setTimeout(() => $('#sp-close-2').focus({ preventScroll: true }), 50);
  }

  function closeStopPage() {
    stopPage.classList.remove('open');
    stopPage.setAttribute('aria-hidden', 'true');
    pageStopId = null;
    setTimeout(() => {
      if (!pageStopId && miniMap) { miniMap.remove(); miniMap = null; }
    }, 450);
    $('#mini-btn').focus({ preventScroll: true });
  }

  function renderPage(stop) {
    const st = STATE[stop.state];
    $('#sp-crumbs').textContent = `Остановки › ${stop.name}`;

    const routesHtml = stop.buses.map(b => {
      const has = !!stop.schedule[b];
      const count = has ? stop.schedule[b].length : 0;
      return `<div class="route-row">
        <button class="chip${has ? '' : ' muted'}" data-route="${esc(b)}" ${has ? '' : 'disabled'} aria-label="Маршрут ${esc(b)}">${esc(b)}</button>
        <span>${has ? `${count} рейс${count % 10 === 1 && count !== 11 ? '' : (count % 10 >= 2 && count % 10 <= 4 && (count < 12 || count > 14) ? 'а' : 'ов')} в день · ${stop.schedule[b][0]}–${stop.schedule[b][count - 1]}` : 'Расписание недоступно'}</span>
      </div>`;
    }).join('');

    const tabs = Object.keys(stop.schedule).map(r =>
      `<button class="tab" role="tab" data-tab="${esc(r)}" aria-selected="${r === pageRoute}">№${esc(r)}</button>`
    ).join('');

    const nearbyHtml = stop.nearby.map(nid => {
      const n = byId[nid];
      if (!n) return '';
      const d = haversine(stop.coords, n.coords);
      return `<button class="near-btn" data-near="${esc(n.id)}" style="--c:${STATE[n.state].color}">
        <span class="nb-dot">${ICON_BUS}</span>
        <span><span class="nb-name">${esc(n.name)}</span><br><span class="nb-sub">${fmtDist(d)} · ${STATE[n.state].label}</span></span>
        <span class="nb-arrow">${ICON_CHEVRON}</span>
      </button>`;
    }).join('');

    pageContent.innerHTML = `
      <header class="sp-head">
        <div class="sp-icon" style="--c:${st.color}">${ICON_BUS_L}</div>
        <div>
          <h2 id="sp-title">${esc(stop.name)}</h2>
          <p>${esc(stop.address)} · Построена в ${esc(stop.built)} г.</p>
        </div>
        <span class="badge" style="--c:${st.color}">${st.label}</span>
      </header>
      <p class="sp-desc">${esc(stop.description)}</p>

      <div class="sp-body">
        <div class="sp-col">
          <section class="card">
            <h3>Благоустройство</h3>
            <div class="stats">
              <div class="stat"><b>${stop.benches}</b><span>Лавочки</span></div>
              <div class="stat"><b>${stop.bins}</b><span>Урны</span></div>
              <div class="stat"><b>${stop.trees}</b><span>Деревья</span></div>
              <div class="stat"><b>${stop.buses.length}</b><span>Маршруты</span></div>
            </div>
            <div class="facilities">
              <div class="facility"><span class="f-ic" aria-hidden="true">🛣️</span>Покрытие<span class="f-val">${SURFACE[stop.surface] || esc(stop.surface)}</span></div>
              <div class="facility"><span class="f-ic" aria-hidden="true">🌳</span>Сквер<span class="f-val">${yesNo(stop.has_square)}</span></div>
              <div class="facility"><span class="f-ic" aria-hidden="true">🛒</span>Магазин<span class="f-val">${yesNo(stop.has_shop)}</span></div>
              <div class="facility"><span class="f-ic" aria-hidden="true">🏋️</span>Тренажёры<span class="f-val">${yesNo(stop.trainers)}</span></div>
            </div>
          </section>

          <section class="card">
            <h3>Расписание <small id="sched-now"></small></h3>
            ${tabs ? `<div class="tabs" role="tablist" aria-label="Маршрут">${tabs}</div>
              <div id="sched-next" class="next-card"></div>
              <div id="sched-grid" class="times" role="tabpanel"></div>`
              : `<p class="no-sched">Расписание для этой остановки недоступно.</p>`}
          </section>
        </div>

        <div class="sp-col">
          <section class="card">
            <h3>На карте <small>${stop.coords[1].toFixed(5)}, ${stop.coords[0].toFixed(5)}</small></h3>
            <div id="mini-map" class="mini-map" aria-label="Мини-карта остановки ${esc(stop.name)}"></div>
          </section>
          <section class="card">
            <h3>Маршруты</h3>
            <div class="route-list">${routesHtml}</div>
          </section>
          <section class="card">
            <h3>Рядом</h3>
            <div class="nearby">${nearbyHtml || '<p class="no-sched">Нет данных</p>'}</div>
          </section>
        </div>
      </div>`;

    pageContent.scrollTop = 0;
    pageContent.classList.remove('fade');
    void pageContent.offsetWidth;
    pageContent.classList.add('fade');

    renderSchedule();
    initMiniMap(stop);
  }

  function renderSchedule() {
    const stop = byId[pageStopId];
    if (!stop || !pageRoute) return;
    const times = stop.schedule[pageRoute];
    const grid = $('#sched-grid');
    const next = $('#sched-next');
    if (!times || !grid || !next) return;

    const now = nowMin();
    const d = new Date();
    $('#sched-now').textContent = `Сейчас ${pad(d.getHours())}:${pad(d.getMinutes())}`;

    const nextIdx = times.findIndex(t => toMin(t) >= now);
    if (nextIdx >= 0) {
      const t = times[nextIdx];
      const after = times[nextIdx + 1];
      next.innerHTML = `<span class="n-time">${t}</span>
        <span class="n-sub"><b>№${esc(pageRoute)}</b> · ${fmtWait(toMin(t) - now)}${after ? `<br>Следующий в ${after}` : '<br>Последний рейс сегодня'}</span>`;
    } else {
      next.innerHTML = `<span class="n-time">${times[0]}</span>
        <span class="n-sub"><b>Рейсов сегодня больше нет</b><br>Первый завтра в ${times[0]}</span>`;
    }

    const groups = {};
    times.forEach((t, i) => { const h = t.slice(0, 2); (groups[h] = groups[h] || []).push({ t, i }); });
    grid.innerHTML = Object.keys(groups).sort().map(h => `
      <div class="t-row">
        <span class="t-hour">${h}</span>
        <span class="t-mins">${groups[h].map(({ t, i }) => {
          const cls = i === nextIdx ? 'next' : (toMin(t) < now ? 'past' : '');
          return `<span class="t-min ${cls}" ${i === nextIdx ? 'aria-current="time"' : ''}>${t.slice(3)}</span>`;
        }).join('')}</span>
      </div>`).join('');

    $$('.tab', pageContent).forEach(tab => tab.setAttribute('aria-selected', String(tab.dataset.tab === pageRoute)));
    $$('.route-row .chip', pageContent).forEach(c => c.classList.toggle('active', c.dataset.route === pageRoute));
  }

  function initMiniMap(stop) {
    if (miniMap) { miniMap.remove(); miniMap = null; }
    const container = $('#mini-map');
    if (!container) return;

    miniMap = new maplibregl.Map({
      container,
      style: cloneStyle(currentStyle.style),
      center: stop.coords,
      zoom: 15.5,
      attributionControl: false,
      dragRotate: false,
      pitchWithRotate: false
    });

    const mainEl = document.createElement('div');
    mainEl.className = 'marker active';
    mainEl.style.setProperty('--c', STATE[stop.state].color);
    mainEl.innerHTML = `<span class="marker-pulse"></span><span class="marker-dot">${ICON_BUS}</span>`;
    new maplibregl.Marker({ element: mainEl, anchor: 'center' }).setLngLat(stop.coords).addTo(miniMap);

    const b = new maplibregl.LngLatBounds(stop.coords, stop.coords);
    stop.nearby.forEach(nid => {
      const n = byId[nid];
      if (!n) return;
      b.extend(n.coords);
      const el = document.createElement('div');
      el.className = 'marker small';
      el.style.setProperty('--c', STATE[n.state].color);
      el.title = n.name;
      el.setAttribute('role', 'button');
      el.setAttribute('aria-label', `Перейти к остановке ${n.name}`);
      el.innerHTML = `<span class="marker-dot"></span>`;
      el.addEventListener('click', e => { e.stopPropagation(); goToNearby(n.id); });
      new maplibregl.Marker({ element: el, anchor: 'center' }).setLngLat(n.coords).addTo(miniMap);
    });

    const mm = miniMap;
    mm.on('load', () => {
      mm.resize();
      mm.fitBounds(b, { padding: 36, maxZoom: 16, duration: 0 });
    });
    setTimeout(() => { if (miniMap === mm) mm.resize(); }, 420);
  }

  function goToNearby(id) {
    selectStop(id);
    openStopPage(id);
  }

  pageContent.addEventListener('click', e => {
    const tab = e.target.closest('[data-tab]');
    if (tab) { pageRoute = tab.dataset.tab; renderSchedule(); return; }
    const chip = e.target.closest('[data-route]');
    if (chip && !chip.disabled) {
      pageRoute = chip.dataset.route;
      renderSchedule();
      const grid = $('#sched-grid');
      if (grid && window.innerWidth <= 900) grid.scrollIntoView({ behavior: 'smooth', block: 'center' });
      return;
    }
    const near = e.target.closest('[data-near]');
    if (near) goToNearby(near.dataset.near);
  });

  $('#sp-close').addEventListener('click', closeStopPage);
  $('#sp-close-2').addEventListener('click', closeStopPage);
  stopPage.addEventListener('click', e => { if (e.target === stopPage) closeStopPage(); });

  setInterval(() => { if (pageStopId) renderSchedule(); }, 30000);

  // ================= SEARCH =================
  const search = $('#search');
  const results = $('#search-results');
  let resultItems = [];
  let activeIdx = -1;

  function highlight(text, q) {
    const safe = esc(text);
    if (!q) return safe;
    const i = text.toLowerCase().indexOf(q);
    if (i < 0) return safe;
    return esc(text.slice(0, i)) + '<mark>' + esc(text.slice(i, i + q.length)) + '</mark>' + esc(text.slice(i + q.length));
  }

  function runSearch() {
    const q = search.value.trim().toLowerCase();
    if (!q) { closeResults(); return; }
    resultItems = STOPS.filter(s =>
      s.name.toLowerCase().includes(q) ||
      s.address.toLowerCase().includes(q) ||
      s.buses.some(b => b.toLowerCase() === q || b.toLowerCase().startsWith(q))
    ).slice(0, 8);
    activeIdx = resultItems.length ? 0 : -1;

    results.innerHTML = resultItems.length
      ? resultItems.map((s, i) => {
          const busMatch = s.buses.filter(b => b.toLowerCase().startsWith(q));
          return `<li role="option" id="opt-${s.id}" data-id="${s.id}" aria-selected="${i === activeIdx}">
            <span class="state-dot" style="background:${STATE[s.state].color};width:10px;height:10px;margin:0"></span>
            <span><span class="r-name">${highlight(s.name, q)}</span><br>
            <span class="r-sub">${highlight(s.address, q)}${busMatch.length ? ` · №${busMatch.map(esc).join(', №')}` : ''}</span></span>
          </li>`;
        }).join('')
      : `<li class="empty" role="option" aria-disabled="true">Ничего не найдено</li>`;

    results.classList.add('open');
    search.setAttribute('aria-expanded', 'true');
    updateActive();
  }

  function updateActive() {
    $$('li[data-id]', results).forEach((li, i) => li.setAttribute('aria-selected', String(i === activeIdx)));
    const cur = resultItems[activeIdx];
    if (cur) search.setAttribute('aria-activedescendant', `opt-${cur.id}`);
    else search.removeAttribute('aria-activedescendant');
  }

  function closeResults() {
    results.classList.remove('open');
    search.setAttribute('aria-expanded', 'false');
    search.removeAttribute('aria-activedescendant');
  }

  function chooseResult(id) {
    closeResults();
    search.blur();
    selectStop(id);
  }

  search.addEventListener('input', runSearch);
  search.addEventListener('focus', () => { if (search.value.trim()) runSearch(); });
  search.addEventListener('keydown', e => {
    if (e.key === 'ArrowDown' && resultItems.length) { e.preventDefault(); activeIdx = (activeIdx + 1) % resultItems.length; updateActive(); }
    else if (e.key === 'ArrowUp' && resultItems.length) { e.preventDefault(); activeIdx = (activeIdx - 1 + resultItems.length) % resultItems.length; updateActive(); }
    else if (e.key === 'Enter' && resultItems[activeIdx]) { e.preventDefault(); chooseResult(resultItems[activeIdx].id); }
    else if (e.key === 'Escape') { search.value = ''; closeResults(); search.blur(); }
  });
  results.addEventListener('mousedown', e => {
    const li = e.target.closest('li[data-id]');
    if (li) { e.preventDefault(); chooseResult(li.dataset.id); }
  });

  // ================= POPOVERS =================
  const popStyle = $('#pop-style');
  const popLayers = $('#pop-layers');
  const btnStyle = $('#btn-style');
  const btnLayers = $('#btn-layers');

  function togglePopover(pop, btn) {
    const open = !pop.classList.contains('open');
    closePopovers();
    if (open) { pop.classList.add('open'); btn.setAttribute('aria-expanded', 'true'); }
  }
  function closePopovers() {
    [popStyle, popLayers].forEach(p => p.classList.remove('open'));
    [btnStyle, btnLayers].forEach(b => b.setAttribute('aria-expanded', 'false'));
  }

  btnStyle.addEventListener('click', e => { e.stopPropagation(); togglePopover(popStyle, btnStyle); });
  btnLayers.addEventListener('click', e => { e.stopPropagation(); togglePopover(popLayers, btnLayers); });
  document.addEventListener('click', e => {
    if (!e.target.closest('.popover') && !e.target.closest('.actions .icon-btn')) closePopovers();
    if (!e.target.closest('.search-wrap')) closeResults();
  });

  // Style list
  const styleList = $('#style-list');
  function renderStyleList() {
    styleList.innerHTML = STYLES.map(s => `
      <button class="pop-item" role="menuitemradio" data-style="${s.id}" aria-checked="${s.id === currentStyle.id}">
        <span class="swatch" style="background:${s.swatch}"></span>${s.name}<span class="check">${ICON_CHECK}</span>
      </button>`).join('');
  }
  renderStyleList();

  styleList.addEventListener('click', e => {
    const item = e.target.closest('[data-style]');
    if (!item) return;
    const next = STYLES.find(s => s.id === item.dataset.style);
    if (!next || next.id === currentStyle.id) return;
    currentStyle = next;
    document.body.classList.toggle('dark', next.dark);
    map.setStyle(cloneStyle(next.style), { diff: false });
    if (miniMap) miniMap.setStyle(cloneStyle(next.style), { diff: false });
    renderStyleList();
  });

  // Layers
  popLayers.addEventListener('click', e => {
    const item = e.target.closest('[data-layer]');
    if (!item) return;
    const key = item.dataset.layer;
    layerState[key] = !layerState[key];
    item.setAttribute('aria-checked', String(layerState[key]));
    if (key === 'route') {
      ['route-casing', 'route-line'].forEach(l => {
        if (map.getLayer(l)) map.setLayoutProperty(l, 'visibility', layerState.route ? 'visible' : 'none');
      });
      $('.legend .route-key').style.opacity = layerState.route ? '1' : '.4';
    }
    if (key === 'labels') document.body.classList.toggle('hide-labels', !layerState.labels);
  });

  // ================= LEGEND =================
  const legendItems = $('#legend-items');
  legendItems.innerHTML = Object.entries(STATE).map(([k, v]) => {
    const count = STOPS.filter(s => s.state === k).length;
    return `<button class="legend-item" data-state="${k}" aria-pressed="true" title="Показать/скрыть">
      <span class="ldot" style="background:${v.color}"></span>${v.label}<span class="count">${count}</span>
    </button>`;
  }).join('');

  legendItems.addEventListener('click', e => {
    const item = e.target.closest('[data-state]');
    if (!item) return;
    const k = item.dataset.state;
    if (visibleStates.has(k)) visibleStates.delete(k); else visibleStates.add(k);
    item.setAttribute('aria-pressed', String(visibleStates.has(k)));
    STOPS.forEach(s => {
      const el = markers[s.id].getElement();
      const show = visibleStates.has(s.state);
      el.style.visibility = show ? '' : 'hidden';
      if (!show && currentId === s.id) hideMini();
    });
  });

  // ================= GEOLOCATION =================
  const btnLocate = $('#btn-locate');
  btnLocate.addEventListener('click', () => {
    if (!('geolocation' in navigator)) { toast('Геолокация не поддерживается браузером'); return; }
    btnLocate.classList.add('loading');
    navigator.geolocation.getCurrentPosition(pos => {
      btnLocate.classList.remove('loading');
      btnLocate.classList.add('located');
      const ll = [pos.coords.longitude, pos.coords.latitude];
      if (!userMarker) {
        const el = document.createElement('div');
        el.className = 'user-marker';
        el.setAttribute('aria-label', 'Вы здесь');
        el.innerHTML = '<span class="u-halo"></span><span class="u-dot"></span>';
        userMarker = new maplibregl.Marker({ element: el, anchor: 'center' }).setLngLat(ll).addTo(map);
      } else {
        userMarker.setLngLat(ll);
      }
      let nearest = null, best = Infinity;
      STOPS.forEach(s => { const d = haversine(ll, s.coords); if (d < best) { best = d; nearest = s; } });
      if (best < 30000) {
        const b = new maplibregl.LngLatBounds(ll, ll).extend(nearest.coords);
        map.fitBounds(b, { padding: { top: 140, bottom: 160, left: 120, right: 120 }, maxZoom: 16.5, duration: 1000 });
        toast(`Ближайшая остановка: ${nearest.name} · ${fmtDist(best)}`);
      } else {
        map.flyTo({ center: ll, zoom: 14, duration: 1000 });
        toast(`Вы далеко от остановок: ${fmtDist(best)} до «${nearest.name}»`);
      }
    }, err => {
      btnLocate.classList.remove('loading');
      const msg = { 1: 'Доступ к геолокации запрещён', 2: 'Местоположение недоступно', 3: 'Истекло время ожидания' }[err.code] || 'Не удалось определить местоположение';
      toast(msg);
    }, { enableHighAccuracy: true, timeout: 10000, maximumAge: 60000 });
  });

  // ================= KEYBOARD =================
  document.addEventListener('keydown', e => {
    if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); search.focus(); search.select(); return; }
    if (e.key === '/' && document.activeElement !== search && !e.target.closest('input')) { e.preventDefault(); search.focus(); return; }
    if (e.key === 'Escape') {
      if ($('.popover.open')) { closePopovers(); return; }
      if (stopPage.classList.contains('open')) { closeStopPage(); return; }
      if (miniCard.classList.contains('show')) hideMini();
    }
  });
})();
</script>
</body>
</html>
